<!DOCTYPE html>
<html lang="ja" class="scroll-smooth font-sans">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - まりのたいむず</title>
    <meta name="description" content="櫻坂46 幸阪茉里乃さんのスケジュール・出演情報まとめです。">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'sakura-pink': '#fce4ec',
                        'sakura-dark': '#f8bbd0',
                        'pearl-green': '#e0f2f1',
                        'pearl-dark': '#b2dfdb',
                        'soft-black': '#4a4a4a',
                        'soft-brown': '#5d4037',
                    },
                    fontFamily: {
                        sans: ['Montserrat', '"Zen Maru Gothic"', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body
    class="bg-gray-50 text-soft-black font-sans leading-relaxed relative overflow-x-hidden min-h-screen flex flex-col">
    <!-- 背景装飾 -->
    <div id="sakura-container" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <!-- Header -->
    <header class="fixed top-0 w-full z-50 transition-all duration-300 backdrop-blur-md bg-white/70 shadow-sm">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html"
                class="text-xl font-bold text-soft-brown tracking-widest hover:text-sakura-dark transition-colors">まりのたいむず</a>
            <nav id="nav-menu"
                class="hidden absolute top-full left-0 w-full bg-white/95 backdrop-blur-md shadow-md py-4 flex-col space-y-4 md:static md:flex md:flex-row md:space-y-0 md:space-x-4 lg:space-x-6 md:w-auto md:bg-transparent md:shadow-none text-[10px] lg:text-[11px] font-bold tracking-[0.2em] uppercase items-center">
                <a href="schedule.html"
                    class="text-sakura-dark transition-colors border-b-2 border-sakura-dark pb-1 block">Schedule</a>
                <a href="index.html#about" class="hover:text-sakura-dark transition-colors block">About Us</a>
                <a href="log.html" class="hover:text-sakura-dark transition-colors block">Marino's Log</a>
                <a href="gallery.html" class="hover:text-sakura-dark transition-colors block">Gallery</a>
                <a href="journal.html" class="hover:text-sakura-dark transition-colors block">Our Journal</a>
                <a href="activities.html" class="hover:text-sakura-dark transition-colors block">Our Activities</a>
                <a href="index.html#links" class="hover:text-sakura-dark transition-colors block">Official Links</a>
                <a href="index.html#contact" class="hover:text-sakura-dark transition-colors block">Contact Us</a>
            </nav>
            <button id="menu-btn" class="md:hidden text-soft-black focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                    </path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 pt-32 pb-24 flex-grow">
        <section class="px-4 max-w-4xl mx-auto fade-up transition-all duration-1000">
            <div class="text-center mb-16">
                <a href="index.html"
                    class="inline-flex items-center text-xs font-bold text-gray-400 hover:text-sakura-dark transition-colors mb-8 uppercase tracking-[0.2em]">
                    &larr; Back to Home
                </a>
                <h2 class="text-3xl md:text-4xl font-bold text-soft-brown tracking-[0.3em] uppercase">
                    Schedule
                </h2>
                <p class="text-sm text-gray-500 mt-4 tracking-widest uppercase">出演情報・スケジュール</p>
            </div>

            <!-- Filter Categories -->
            <div class="mb-8 overflow-x-auto pb-4 hide-scrollbar">
                <div id="schedule-filter-bar"
                    class="flex justify-start md:justify-center w-max min-w-full gap-3 px-4 md:px-0">
                    <!-- Filter buttons injected by JS -->
                </div>
            </div>

            <div class="bg-white rounded-3xl shadow-sm overflow-hidden p-6 md:p-12 border border-gray-100 relative">
                <!-- Toggle Past Schedules -->
                <div class="absolute top-6 right-6 md:top-8 md:right-8">
                    <button id="toggle-past-schedule-btn"
                        class="flex items-center gap-2 text-xs font-bold text-gray-400 hover:text-soft-brown transition-colors tracking-widest bg-gray-50 px-3 py-1.5 rounded-full border border-gray-200">
                        <span class="w-2 h-2 rounded-full bg-gray-300 transition-colors"
                            id="past-schedule-indicator"></span>
                        <span id="past-schedule-text">過去の予定を表示</span>
                    </button>
                </div>

                <ul id="schedule-full-list" class="space-y-6 mt-12 md:mt-4">
                    <!-- Schedule items will be injected here by JS -->
                    <p class="text-sm text-gray-400 text-center py-16">読み込み中...</p>
                </ul>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-50 border-t border-gray-200 py-8 text-center text-xs text-gray-400">
        <p class="mb-2">&copy; 2026 まりのたいむず. All Rights Reserved.</p>
        <p>※当サイトは非公式ファンサイトです。所属事務所および関係者様とは一切関係ありません。</p>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
</body>

</html>
